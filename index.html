<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marin Magic | County of Marin</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23000'/%3E%3Cg fill='none' stroke='%23e5b53b' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(9,9) scale(1.25)'%3E%3Cpath d='m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72'/%3E%3Cpath d='m14 7 3 3'/%3E%3Cpath d='M5 6v4'/%3E%3Cpath d='M19 14v4'/%3E%3Cpath d='M10 2v2'/%3E%3Cpath d='M7 8H3'/%3E%3Cpath d='M21 16h-4'/%3E%3Cpath d='M11 3H9'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="description" content="Convert spreadsheet data into CMS-ready structured rich text.">
    <link rel="stylesheet" href="vendor/marinos/marinos.css">
    <style>
      .magic-actions {
        margin-bottom: 1.5rem;
      }

      .magic-hero {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
        gap: 1rem;
        align-items: stretch;
        margin-bottom: 1.5rem;
      }

      .magic-preview {
        min-height: 14rem;
        padding: 1rem;
        border: 1px solid var(--app-border);
        border-radius: var(--pico-border-radius);
        background: var(--app-surface);
      }

      .magic-preview--html {
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }

      .magic-field-list {
        display: grid;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .magic-field-item {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 0.75rem;
        align-items: center;
        min-height: 3rem;
        padding: 0.75rem;
        border: 1px solid var(--app-border);
        border-radius: var(--pico-border-radius);
        background: var(--app-surface);
      }

      .magic-field-item[draggable="true"] {
        cursor: grab;
      }

      .magic-field-item.is-dragging {
        opacity: 0.7;
      }

      .magic-field-item.is-drag-over {
        border-color: var(--app-accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--app-accent) 25%, transparent);
      }

      .magic-field-label {
        margin: 0;
        font-weight: 700;
      }

      .magic-move-controls {
        display: inline-flex;
        gap: 0.375rem;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .magic-output h2,
      .magic-output h3,
      .magic-output h4,
      .magic-output h5,
      .magic-output h6 {
        margin-top: 1rem;
      }

      @media (max-width: 720px) {
        .magic-field-item {
          width: 100%;
        }

        .magic-field-item {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .magic-move-controls {
          grid-column: 1 / -1;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="container app-alert app-alert--danger" role="alert">JavaScript is required to convert spreadsheet data in the browser.</div>
    </noscript>

    <marin-os-banner></marin-os-banner>

    <marin-app-header
      app-name="Marin Magic"
      app-description="Convert spreadsheet data into CMS-ready structured rich text."
    >
      <template data-icon>
        <svg viewBox="0 0 24 24"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
      </template>
    </marin-app-header>

    <main id="main" class="container app-main">
      <section id="start" data-tab-section="start" aria-labelledby="home-heading">
        <div id="app-status-message" role="status" aria-live="polite"></div>

        <div class="magic-hero">
          <article class="app-card upload-panel">
            <h2 id="home-heading">Upload</h2>
            <p id="upload-help" class="app-help-text">Drag and drop a <code>.csv</code>/<code>.xlsx</code>/<code>.xls</code>/<code>.json</code> file anywhere on this page, or use the browse button. Your file stays in this browser.</p>
            <div class="app-actions">
              <button id="browse-files" type="button" class="action-button" data-icon="upload">Browse files</button>
            </div>
            <input id="file-input" class="visually-hidden" type="file" aria-labelledby="home-heading" aria-describedby="upload-help" accept=".csv,.xlsx,.xls,.json,application/json,text/csv">
            <p id="file-status" class="app-help-text" role="status" aria-live="polite" aria-atomic="true"></p>
          </article>
        </div>

        <div id="home-panel" aria-label="Marin Magic conversion workflow">
          <article id="mapping-panel" class="app-card" hidden>
            <div class="app-toolbar">
              <div>
                <h2>Design</h2>
              </div>
            </div>
            <div class="app-form-grid">
              <div class="app-field">
                <label for="heading-column">Select heading column</label>
                <select id="heading-column"></select>
              </div>
              <div class="app-field">
                <label for="heading-level">Heading level</label>
                <select id="heading-level">
                  <option value="h2" selected>h2</option>
                  <option value="h3">h3</option>
                  <option value="h4">h4</option>
                  <option value="h5">h5</option>
                  <option value="h6">h6</option>
                </select>
              </div>
            </div>
            <fieldset>
              <legend>List items</legend>
              <div id="field-list" class="magic-field-list"></div>
            </fieldset>
          </article>

          <article class="app-card">
            <h2>Preview</h2>
            <div class="app-actions magic-actions">
              <button id="generate-preview" type="button" class="action-button" data-icon="refresh-cw">Get preview</button>
              <div class="menu">
                <button type="button" class="action-button menu-toggle" data-icon="copy" aria-expanded="false" aria-controls="copy-panel" aria-label="Copy, choose a format" title="Copy"><svg class="menu-toggle__caret" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
                <div id="copy-panel" class="menu-panel" hidden>
                  <button id="copy-rich-text" type="button" data-button-kind="menu-item" aria-label="Copy rich text">Text</button>
                  <button id="copy-html" type="button" data-button-kind="menu-item" aria-label="Copy HTML source">HTML</button>
                  <button id="copy-md" type="button" data-button-kind="menu-item" aria-label="Copy Markdown">Markdown</button>
                </div>
              </div>
              <div class="menu">
                <button type="button" class="action-button menu-toggle" data-icon="download" aria-expanded="false" aria-controls="download-panel" aria-label="Download, choose a format" title="Download"><svg class="menu-toggle__caret" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
                <div id="download-panel" class="menu-panel" hidden>
                  <button id="download-text" type="button" data-button-kind="menu-item" aria-label="Download text">Text</button>
                  <button id="download-html" type="button" data-button-kind="menu-item" aria-label="Download HTML">HTML</button>
                  <button id="download-md" type="button" data-button-kind="menu-item" aria-label="Download Markdown">Markdown</button>
                </div>
              </div>
              <button id="reset-tool" class="action-button" type="button" data-icon="rotate-ccw" aria-label="Reset" title="Reset"></button>
            </div>

            <div class="tab-list" role="tablist" aria-label="Preview modes">
              <button id="text-tab" class="tab-button" type="button" role="tab" aria-selected="true" aria-controls="text-panel">Text</button>
              <button id="html-tab" class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="html-panel" tabindex="-1">HTML</button>
            </div>

            <div id="text-panel" class="magic-preview magic-output" role="tabpanel" aria-labelledby="text-tab">
              <p class="app-help-text">Preview will appear after a file is loaded.</p>
            </div>
            <pre id="html-panel" class="magic-preview magic-preview--html" role="tabpanel" aria-labelledby="html-tab" hidden></pre>
          </article>
        </div>
      </section>

      <marin-app-info
        app-name="Marin Magic"
        repo="marin-magic"
        security-src="security.json"
      >
        <template data-about>
          <p>Upload CSV, XLSX, XLS, or JSON data, choose the heading and list fields, preview the output, then copy rich text or HTML source into your CMS.</p>
          <h3>Supported output</h3>
          <p><span class="app-status" data-status="success">CMS-ready HTML</span></p>
          <ul>
            <li>Heading levels h2 through h6</li>
            <li>Unordered lists from selected fields</li>
            <li>Rich text and source copy tools</li>
          </ul>
          <h3>Prepare your file</h3>
          <ul>
            <li>Keep only the data you need.</li>
            <li>Remove formulas and use plain text values.</li>
            <li>Make sure column headers are clearly labeled.</li>
            <li>Export as CSV when possible, or upload XLSX, XLS, or JSON.</li>
          </ul>
          <h3>Configure field mapping</h3>
          <ol>
            <li>Choose the column that should become each section heading.</li>
            <li>Select the heading level to generate.</li>
            <li>Choose which columns should appear as list items.</li>
            <li>Drag fields or use Move up and Move down to order list items.</li>
          </ol>
          <h3>Copy into the CMS</h3>
          <ul>
            <li>Use Copy rich text for visual editors.</li>
            <li>Use Copy HTML source for source or code editors.</li>
            <li>Preview your CMS page before publishing.</li>
          </ul>
        </template>
      </marin-app-info>
    </main>

    <marin-app-footer app-name="Marin Magic"></marin-app-footer>
    <marin-app-feedback></marin-app-feedback>


    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="vendor/marinos/marinos.js" defer></script>
    <script>
      const statusMessage = document.querySelector("#app-status-message");

      const fileInput = document.querySelector("#file-input");
      const browseFilesButton = document.querySelector("#browse-files");
      const fileStatus = document.querySelector("#file-status");
      const mappingPanel = document.querySelector("#mapping-panel");
      const headingColumn = document.querySelector("#heading-column");
      const headingLevel = document.querySelector("#heading-level");
      const fieldList = document.querySelector("#field-list");
      const textPanel = document.querySelector("#text-panel");
      const htmlPanel = document.querySelector("#html-panel");
      const generatePreviewButton = document.querySelector("#generate-preview");
      const downloadHtmlButton = document.querySelector("#download-html");
      const resetToolButton = document.querySelector("#reset-tool");
      const copyRichTextButton = document.querySelector("#copy-rich-text");
      const copyHtmlButton = document.querySelector("#copy-html");
      const previewTabs = Array.from(document.querySelectorAll("#text-tab, #html-tab"));

      let headers = [];
      let rows = [];
      let output = "";
      let outputText = "";
      let outputMarkdown = "";

      function announce(message) {
        if (statusMessage) statusMessage.textContent = message;
      }

      function clean(value) {
        return value == null ? "" : String(value).trim();
      }

      function esc(value) {
        return clean(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function setFileStatus(message) {
        fileStatus.textContent = message;
      }

      function activateTabs(tabs, activeTab) {
        tabs.forEach((tab) => {
          const selected = tab === activeTab;
          const panel = document.querySelector(`#${tab.getAttribute("aria-controls")}`);
          tab.setAttribute("aria-selected", selected ? "true" : "false");
          tab.tabIndex = selected ? 0 : -1;
          if (panel) panel.hidden = !selected;
        });
      }

      function setupTabs(tabs, onActivate) {
        tabs.forEach((tab, index) => {
          tab.addEventListener("click", () => {
            activateTabs(tabs, tab);
            onActivate(tab);
          });
          tab.addEventListener("keydown", (event) => {
            let nextIndex = index;
            if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
            else if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
            else if (event.key === "Home") nextIndex = 0;
            else if (event.key === "End") nextIndex = tabs.length - 1;
            else return;
            event.preventDefault();
            tabs[nextIndex].focus();
            activateTabs(tabs, tabs[nextIndex]);
            onActivate(tabs[nextIndex]);
          });
        });
      }

      function parseCsv(text) {
        const out = [];
        let row = [];
        let cell = "";
        let inQuotes = false;
        const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
        for (let i = 0; i < normalized.length; i += 1) {
          const ch = normalized[i];
          const next = normalized[i + 1];
          if (ch === "\"") {
            if (inQuotes && next === "\"") {
              cell += "\"";
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === "," && !inQuotes) {
            row.push(cell);
            cell = "";
          } else if (ch === "\n" && !inQuotes) {
            row.push(cell);
            out.push(row);
            row = [];
            cell = "";
          } else {
            cell += ch;
          }
        }
        if (cell !== "" || row.length) {
          row.push(cell);
          out.push(row);
        }
        return out.filter((item) => Array.isArray(item) && item.some((value) => clean(value)));
      }

      function parseJson(text) {
        const data = JSON.parse(text);
        if (!Array.isArray(data)) throw new Error("JSON must be an array of objects.");
        const keys = [...new Set(data.flatMap((item) => Object.keys(item || {})))];
        return [keys, ...data.map((item) => keys.map((key) => (item && item[key] != null ? String(item[key]) : "")))];
      }

      function detectFileType(file) {
        const name = clean(file?.name).toLowerCase();
        const type = clean(file?.type).toLowerCase();
        if (name.endsWith(".xlsx") || name.endsWith(".xls")) return "xlsx";
        if (name.endsWith(".csv")) return "csv";
        if (name.endsWith(".json")) return "json";
        if (type.includes("spreadsheetml") || type.includes("ms-excel")) return "xlsx";
        if (type.includes("csv")) return "csv";
        if (type.includes("json")) return "json";
        return "unknown";
      }

      function moveItem(item, direction) {
        const sibling = direction < 0 ? item.previousElementSibling : item.nextElementSibling;
        if (!sibling) return;
        if (direction < 0) fieldList.insertBefore(item, sibling);
        else fieldList.insertBefore(sibling, item);
        setFileStatus(`Moved ${item.querySelector(".magic-field-label").textContent}.`);
      }

      function enableDragDrop() {
        let dragged = null;
        Array.from(fieldList.querySelectorAll(".magic-field-item")).forEach((item) => {
          item.addEventListener("dragstart", () => {
            dragged = item;
            item.classList.add("is-dragging");
          });
          item.addEventListener("dragend", () => {
            item.classList.remove("is-dragging");
            Array.from(fieldList.children).forEach((child) => child.classList.remove("is-drag-over"));
            dragged = null;
          });
          item.addEventListener("dragover", (event) => {
            event.preventDefault();
            if (dragged && dragged !== item) item.classList.add("is-drag-over");
          });
          item.addEventListener("dragleave", () => item.classList.remove("is-drag-over"));
          item.addEventListener("drop", (event) => {
            event.preventDefault();
            item.classList.remove("is-drag-over");
            if (!dragged || dragged === item) return;
            const items = Array.from(fieldList.children);
            if (items.indexOf(dragged) < items.indexOf(item)) fieldList.insertBefore(dragged, item.nextSibling);
            else fieldList.insertBefore(dragged, item);
          });
        });
      }

      function renderMapping() {
        headingColumn.innerHTML = "";
        fieldList.innerHTML = "";
        headers.forEach((header, index) => {
          const label = clean(header) || `Column ${index + 1}`;
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = label;
          headingColumn.appendChild(option);

          const item = document.createElement("div");
          item.className = "magic-field-item";
          item.draggable = true;
          const checkbox = document.createElement("input");
          checkbox.id = `field-${index}`;
          checkbox.type = "checkbox";
          checkbox.value = String(index);
          checkbox.checked = index !== 0;
          const checkboxLabel = document.createElement("label");
          checkboxLabel.className = "magic-field-label";
          checkboxLabel.setAttribute("for", checkbox.id);
          checkboxLabel.textContent = label;
          const controls = document.createElement("span");
          controls.className = "magic-move-controls action-group action-group--spaced";
          controls.setAttribute("role", "group");
          controls.setAttribute("aria-label", `Move ${label}`);
          const up = document.createElement("button");
          up.type = "button";
          up.className = "action-button";
          up.dataset.icon = "arrow-up";
          up.title = "Move up";
          up.setAttribute("aria-label", `Move ${label} up`);
          up.addEventListener("click", () => moveItem(item, -1));
          const down = document.createElement("button");
          down.type = "button";
          down.className = "action-button";
          down.dataset.icon = "arrow-down";
          down.title = "Move down";
          down.setAttribute("aria-label", `Move ${label} down`);
          down.addEventListener("click", () => moveItem(item, 1));
          controls.append(up, down);
          item.append(checkbox, checkboxLabel, controls);
          fieldList.appendChild(item);
        });
        enableDragDrop();
      }

      function buildOutput() {
        const headingIndex = Number(headingColumn.value);
        if (Number.isNaN(headingIndex)) throw new Error("No heading selected.");
        const tag = headingLevel.value || "h2";
        const selectedColumns = Array.from(fieldList.querySelectorAll("input:checked"))
          .map((input) => Number(input.value))
          .filter((index) => index !== headingIndex);
        const records = rows
          .map((row) => ({ heading: clean(row[headingIndex]), row }))
          .filter((record) => record.heading)
          .sort((a, b) => a.heading.localeCompare(b.heading, undefined, { sensitivity: "base" }));
        const hashes = "#".repeat(Number(tag.slice(1)) || 2);
        const fields = (record) => selectedColumns.filter((index) => clean(record.row[index]));
        outputText = records.map((record) => [record.heading, ...fields(record).map((index) => `${headers[index]}: ${record.row[index]}`)].join("\n")).join("\n\n");
        outputMarkdown = records.map((record) => [`${hashes} ${record.heading}`, "", ...fields(record).map((index) => `- ${headers[index]}: ${record.row[index]}`)].join("\n")).join("\n\n");
        output = records.map((record) => {
          const listItems = selectedColumns
            .map((index) => clean(record.row[index]) ? `<li>${esc(headers[index])}: ${esc(record.row[index])}</li>` : "")
            .join("");
          return `<${tag}>${esc(record.heading)}</${tag}><ul>${listItems}</ul>`;
        }).join("");
        textPanel.innerHTML = output || '<p class="app-help-text">No output generated.</p>';
        htmlPanel.textContent = output;
      }

      function loadTable(table) {
        table = table.map((row) => (Array.isArray(row) ? row.map(marinCleanText) : row));
        headers = table[0] || [];
        rows = table.slice(1).filter((row) => Array.isArray(row) && row.some((value) => clean(value)));
        if (!headers.length || !rows.length) {
          mappingPanel.hidden = true;
          textPanel.innerHTML = '<p class="app-help-text">No usable data found.</p>';
          htmlPanel.textContent = "";
          setFileStatus("No usable data found.");
          return;
        }
        mappingPanel.hidden = false;
        renderMapping();
        buildOutput();
        setFileStatus("");
      }

      async function handleSelectedFile(file) {
        if (!file) return;
        const type = detectFileType(file);
        if (type === "unknown") {
          setFileStatus("Unsupported file type. Upload .csv, .xlsx, .xls, or .json.");
          return;
        }
        setFileStatus(`Reading ${type.toUpperCase()} file...`);
        try {
          if (type === "xlsx") {
            const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            loadTable(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" }));
            return;
          }
          const { text } = await marinReadText(file);
          loadTable(type === "json" ? parseJson(text) : parseCsv(text));
        } catch (error) {
          console.error(error);
          setFileStatus(type === "xlsx" ? "Could not read the spreadsheet file." : `Could not read the ${type.toUpperCase()} file.`);
        }
      }

      // The shell script is deferred, so its helpers exist once the page has been read.
      document.addEventListener("DOMContentLoaded", () => marinUpload({
        button: browseFilesButton,
        input: fileInput,
        accept: [".csv", ".xlsx", ".xls", ".json"],
        onFile: handleSelectedFile,
        onMessage: setFileStatus,
      }));
      generatePreviewButton.addEventListener("click", () => {
        try {
          buildOutput();
          setFileStatus("");
        } catch (error) {
          console.error(error);
          setFileStatus("Could not generate preview.");
        }
      });
      async function copyOutput(label, copy) {
        setFileStatus((await copy()) ? `Copied ${label}.` : `Could not copy ${label}.`);
      }
      copyRichTextButton.addEventListener("click", () => copyOutput("rich text", () => marinCopyRich(outputText || "", output || "")));
      copyHtmlButton.addEventListener("click", () => copyOutput("HTML", () => marinCopyText(output || "")));
      document.querySelector("#copy-md").addEventListener("click", () => copyOutput("Markdown", () => marinCopyText(outputMarkdown || "")));
      function downloadOutput(content, extension, label) {
        marinDownload({ content: content || "", name: `marinmagic-output.${extension}` });
        setFileStatus(`${label} file downloaded.`);
      }
      downloadHtmlButton.addEventListener("click", () => downloadOutput(output, "html", "HTML"));
      document.querySelector("#download-text").addEventListener("click", () => downloadOutput(outputText, "txt", "Text"));
      document.querySelector("#download-md").addEventListener("click", () => downloadOutput(outputMarkdown, "md", "Markdown"));
      resetToolButton.addEventListener("click", () => {
        fileInput.value = "";
        headers = [];
        rows = [];
        output = "";
        outputText = "";
        outputMarkdown = "";
        mappingPanel.hidden = true;
        fieldList.innerHTML = "";
        textPanel.innerHTML = '<p class="app-help-text">Preview will appear after a file is loaded.</p>';
        htmlPanel.textContent = "";
        setFileStatus("");
      });
      setupTabs(previewTabs, () => undefined);
    </script>
  </body>
</html>
